<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- Restrict scaling for a native app feel on iPad -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Japan Etiquette Presentations</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap');
        body { font-family: 'Inter', sans-serif; }
        
        /* Ensure containers fill screen natively when fullscreen is triggered */
        :fullscreen { background-color: #000; }
        :-webkit-full-screen { background-color: #000; }
        
        /* Hide scrollbar just in case */
        ::-webkit-scrollbar { display: none; }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 w-screen h-screen overflow-hidden fixed inset-0 select-none">

    <!-- SCREEN 1: MAIN MENU -->
    <div id="menu-screen" class="absolute inset-0 z-50 flex flex-col items-center justify-center bg-slate-900 transition-opacity duration-500">
        <div class="text-center mb-10">
            <h1 class="text-4xl md:text-5xl font-semibold mb-3 tracking-tight text-white">Introducing Japan</h1>
            <p class="text-slate-400 text-lg md:text-xl">Select a topic to begin</p>
        </div>
        
        <!-- Video Grid -->
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6 w-full max-w-4xl px-6">
            <!-- Video 1: Eating in Japan -->
            <button class="video-btn group relative flex flex-col justify-end text-left h-48 sm:h-52 rounded-3xl overflow-hidden border border-slate-700 shadow-xl hover:border-slate-400 hover:shadow-2xl transition-all duration-300 p-6 transform hover:-translate-y-1 active:translate-y-0" data-src="assets/eatinginjapanweb.mp4">
                <img src="assets/eating.png" alt="Eating in Japan" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/e2e8f0?text=Eating+in+Japan';" class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500" />
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>
                <div class="relative z-10 flex items-center justify-between">
                    <span class="text-2xl font-semibold text-white tracking-wide">Eating in Japan</span>
                    <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-white group-hover:text-slate-900 transition-colors">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path></svg>
                    </div>
                </div>
            </button>

            <!-- Video 2: Using the Onsen -->
            <button class="video-btn group relative flex flex-col justify-end text-left h-48 sm:h-52 rounded-3xl overflow-hidden border border-slate-700 shadow-xl hover:border-slate-400 hover:shadow-2xl transition-all duration-300 p-6 transform hover:-translate-y-1 active:translate-y-0" data-src="assets/usingonsensweb.mp4">
                <img src="assets/onsen.png" alt="Using the Onsen" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/e2e8f0?text=Using+the+Onsen';" class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500" />
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>
                <div class="relative z-10 flex items-center justify-between">
                    <span class="text-2xl font-semibold text-white tracking-wide">Using the Onsen</span>
                    <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-white group-hover:text-slate-900 transition-colors">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path></svg>
                    </div>
                </div>
            </button>

            <!-- Video 3: Visiting Shrines -->
            <button class="video-btn group relative flex flex-col justify-end text-left h-48 sm:h-52 rounded-3xl overflow-hidden border border-slate-700 shadow-xl hover:border-slate-400 hover:shadow-2xl transition-all duration-300 p-6 transform hover:-translate-y-1 active:translate-y-0" data-src="assets/visitingshrinesweb.mp4">
                <img src="assets/shrine.png" alt="Visiting Shrines" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/e2e8f0?text=Visiting+Shrines';" class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500" />
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>
                <div class="relative z-10 flex items-center justify-between">
                    <span class="text-2xl font-semibold text-white tracking-wide">Visiting Shrines</span>
                    <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-white group-hover:text-slate-900 transition-colors">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path></svg>
                    </div>
                </div>
            </button>

            <!-- Video 4: Using the Train -->
            <button class="video-btn group relative flex flex-col justify-end text-left h-48 sm:h-52 rounded-3xl overflow-hidden border border-slate-700 shadow-xl hover:border-slate-400 hover:shadow-2xl transition-all duration-300 p-6 transform hover:-translate-y-1 active:translate-y-0" data-src="assets/usingtrainweb.mp4">
                <img src="assets/train.png" alt="Using the Train" onerror="this.onerror=null; this.src='https://placehold.co/600x400/1e293b/e2e8f0?text=Using+the+Train';" class="absolute inset-0 w-full h-full object-cover object-center group-hover:scale-105 transition-transform duration-500" />
                <div class="absolute inset-0 bg-gradient-to-t from-slate-950 via-slate-950/60 to-transparent"></div>
                <div class="relative z-10 flex items-center justify-between">
                    <span class="text-2xl font-semibold text-white tracking-wide">Using the Train</span>
                    <div class="w-10 h-10 rounded-full bg-white/20 backdrop-blur-md flex items-center justify-center text-white group-hover:bg-white group-hover:text-slate-900 transition-colors">
                        <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11v11.78a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"></path></svg>
                    </div>
                </div>
            </button>
        </div>
    </div>

    <!-- SCREEN 2: VIDEO PLAYER -->
    <div id="player-screen" class="absolute inset-0 z-40 hidden flex items-center justify-center bg-black">
        
        <!-- Floating Home Button (Top Left) -->
        <button id="home-btn-top" class="absolute top-6 left-6 z-50 text-white bg-slate-900/60 hover:bg-slate-900/90 backdrop-blur-md p-3 px-5 rounded-full transition-all duration-300 shadow-2xl border border-white/20 flex items-center gap-2 cursor-pointer">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            <span class="font-semibold tracking-wide">Home</span>
        </button>

        <!-- Video Element -->
        <video 
            id="presentation-video" 
            playsinline 
            webkit-playsinline 
            preload="auto" 
            class="w-full h-full object-contain">
        </video>

        <!-- Start Overlay (Required for iOS user interaction rules) -->
        <div id="start-overlay" class="absolute inset-0 flex items-center justify-center bg-black/80 backdrop-blur-md z-30 cursor-pointer transition-opacity duration-300">
            <button class="px-10 py-5 bg-white text-black rounded-full font-bold text-2xl shadow-[0_0_40px_rgba(255,255,255,0.2)] hover:scale-105 transition-transform duration-300 flex items-center gap-3">
                <svg class="w-8 h-8" fill="currentColor" viewBox="0 0 20 20"><path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path></svg>
                Start Video
            </button>
        </div>

        <!-- Floating Controls Bar (Bottom Center) -->
        <div class="absolute bottom-8 left-0 right-0 z-20 flex justify-center pointer-events-none">
            
            <div class="flex items-center gap-2 bg-slate-900/60 p-2 px-4 rounded-full backdrop-blur-xl border border-white/10 pointer-events-auto opacity-70 hover:opacity-100 transition-opacity duration-300 shadow-2xl">
                
                <!-- Back to Menu -->
                <button id="back-btn" class="text-slate-300 hover:text-white p-3 rounded-full hover:bg-white/10 transition-colors flex items-center gap-2 text-sm font-medium" title="Back to Menu">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                    Menu
                </button>

                <div class="w-px h-6 bg-white/20 mx-1"></div>

                <!-- Play/Pause -->
                <button id="play-pause-btn" class="text-white bg-white/10 hover:bg-white/25 p-3 rounded-full transition-colors mx-1" title="Play / Pause">
                    <!-- Default to Pause Icon since video auto-plays when overlay is clicked -->
                    <svg id="icon-pause" class="w-6 h-6" fill="currentColor" viewBox="0 0 24 24"><path d="M6 4h4v16H6zm8 0h4v16h-4z"></path></svg>
                    <svg id="icon-play" class="w-6 h-6 hidden" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"></path></svg>
                </button>

                <div class="w-px h-6 bg-white/20 mx-1"></div>

                <!-- Skip Buttons -->
                <button id="skip-donts-btn" class="text-slate-300 px-5 py-3 rounded-full hover:bg-white/10 hover:text-white transition-colors text-sm font-medium flex items-center gap-2">
                    Skip to Don'ts
                    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                </button>

                <button id="skip-outro-btn" class="text-slate-300 px-5 py-3 rounded-full hover:bg-white/10 hover:text-white transition-colors text-sm font-medium flex items-center gap-2">
                    Skip to Outro
                    <svg class="w-4 h-4 opacity-80" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M13 5l7 7-7 7M5 5l7 7-7 7"></path></svg>
                </button>
                
                <div class="w-px h-6 bg-white/20 mx-1"></div>

                <!-- Fullscreen Toggle -->
                <button id="fullscreen-btn" class="text-slate-300 hover:text-white p-3 rounded-full hover:bg-white/10 transition-colors" title="Toggle Fullscreen">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path></svg>
                </button>

            </div>
        </div>
    </div>

    <script>
        // DOM Elements
        const menuScreen = document.getElementById('menu-screen');
        const playerScreen = document.getElementById('player-screen');
        const video = document.getElementById('presentation-video');
        const startOverlay = document.getElementById('start-overlay');
        
        // Control Buttons
        const videoBtns = document.querySelectorAll('.video-btn');
        const backBtn = document.getElementById('back-btn');
        const homeBtnTop = document.getElementById('home-btn-top');
        const playPauseBtn = document.getElementById('play-pause-btn');
        const skipDontsBtn = document.getElementById('skip-donts-btn');
        const skipOutroBtn = document.getElementById('skip-outro-btn');
        const fullscreenBtn = document.getElementById('fullscreen-btn');
        
        // Icons
        const iconPlay = document.getElementById('icon-play');
        const iconPause = document.getElementById('icon-pause');

        // State variables
        let isFading = false;
        const TIME_DONTS = 59.0;
        const TIME_OUTRO = 108.0;

        // --- 1. Menu Selection Logic ---
        videoBtns.forEach(btn => {
            btn.addEventListener('click', () => {
                const src = btn.getAttribute('data-src');
                video.src = src;
                
                // Hide menu, show player
                menuScreen.style.display = 'none';
                playerScreen.classList.remove('hidden');
                
                // Reset UI states
                startOverlay.style.display = 'flex';
                startOverlay.classList.remove('opacity-0');
                updatePlayPauseIcon(true);
            });
        });

        // --- 2. Start Overlay (iOS specific requirement) ---
        startOverlay.addEventListener('click', () => {
            video.play().then(() => {
                startOverlay.classList.add('opacity-0');
                updatePlayPauseIcon(false);
                setTimeout(() => {
                    startOverlay.style.display = 'none';
                }, 300);
            }).catch(err => {
                console.error("Video playback failed:", err);
            });
        });

        // --- 3. Control Bar Interactions ---
        
        // Back to Menu Logic
        function returnToMenu() {
            video.pause();
            video.currentTime = 0;
            video.src = ""; // Clear source to stop buffering
            
            playerScreen.classList.add('hidden');
            menuScreen.style.display = 'flex';
        }

        backBtn.addEventListener('click', returnToMenu);
        homeBtnTop.addEventListener('click', returnToMenu);

        // Play/Pause Toggle
        playPauseBtn.addEventListener('click', () => {
            if (video.paused) {
                video.play();
                updatePlayPauseIcon(false);
            } else {
                video.pause();
                updatePlayPauseIcon(true);
            }
        });

        function updatePlayPauseIcon(isPaused) {
            if (isPaused) {
                iconPlay.classList.remove('hidden');
                iconPause.classList.add('hidden');
            } else {
                iconPlay.classList.add('hidden');
                iconPause.classList.remove('hidden');
            }
        }

        // Sync icon with native video events (in case it finishes or gets interrupted)
        video.addEventListener('play', () => updatePlayPauseIcon(false));
        video.addEventListener('pause', () => updatePlayPauseIcon(true));

        // Skip to Don'ts / Outro
        skipDontsBtn.addEventListener('click', () => fadeAndSeek(TIME_DONTS));
        skipOutroBtn.addEventListener('click', () => fadeAndSeek(TIME_OUTRO));

        // Fullscreen Toggle on the Player Container
        fullscreenBtn.addEventListener('click', () => {
            const isFullscreen = document.fullscreenElement || document.webkitFullscreenElement;
            
            if (!isFullscreen) {
                if (playerScreen.requestFullscreen) {
                    playerScreen.requestFullscreen();
                } else if (playerScreen.webkitRequestFullscreen) { // Safari/iPad
                    playerScreen.webkitRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                }
            }
        });

        // --- 4. Audio Fading & Seeking Engine ---
        function fadeAndSeek(targetTime) {
            if (isFading || video.paused) {
                // If paused, just jump without audio logic
                video.currentTime = targetTime;
                return;
            }
            
            isFading = true;

            const fadeOutDuration = 600; // Increased to 600ms for a noticeable smooth fade out
            const fadeInDuration = 600;  // Increased to 600ms for a smooth fade in
            const steps = 20;            // Increased steps for smoother volume transition
            
            const fadeOutStepTime = fadeOutDuration / steps;
            const fadeInStepTime = fadeInDuration / steps;
            
            let currentStep = 0;
            const originalVolume = video.volume || 1.0;

            // Fade Audio Out
            const fadeOutInterval = setInterval(() => {
                currentStep++;
                video.volume = Math.max(0, originalVolume * (1 - (currentStep / steps)));
                
                if (currentStep >= steps) {
                    clearInterval(fadeOutInterval);
                    video.volume = 0;
                    
                    // Seek Video
                    video.currentTime = targetTime;
                    currentStep = 0;
                    
                    // Fade Audio In
                    const fadeInInterval = setInterval(() => {
                        currentStep++;
                        video.volume = Math.min(originalVolume, originalVolume * (currentStep / steps));
                        
                        if (currentStep >= steps) {
                            clearInterval(fadeInInterval);
                            video.volume = originalVolume; 
                            isFading = false;
                        }
                    }, fadeInStepTime);
                }
            }, fadeOutStepTime);
        }

    </script>
</body>
</html>
